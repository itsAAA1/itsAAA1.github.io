name: VoltZilla static site validation
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - index.html
      - whitepaper.html
      - tests/check_content.py
      - .github/workflows/verify-website.yml
jobs:
  static-content:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check official claims, links and markup
        run: python3 tests/check_content.py
