name: VoltZilla prepare marketplace logo asset
on:
  push:
    branches:
      - feat/voltzilla-cmc-logo-2026-11-20
    paths:
      - scripts/generate_cmc_logo.py
      - .github/workflows/generate-cmc-logo.yml
permissions:
  contents: write
jobs:
  prepare-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image processing library
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Build the 200x200 transparent project image
        run: python3 scripts/generate_cmc_logo.py
      - name: Validate PNG color mode, dimensions and transparency
        run: |
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("logo-cmc-200.png")
          assert im.format == "PNG"
          assert im.mode == "RGBA"
          assert im.size == (200,200)
          assert im.getpixel((0,0))[3] == 0
          assert im.getpixel((199,199))[3] == 0
          print("PNG 200x200 RGBA transparent corners verified")
          PY
      - name: Commit generated image to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- logo-cmc-200.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: generated transparent 200x200 VoltZilla logo"
            git push origin HEAD:feat/voltzilla-cmc-logo-2026-11-20
          fi
